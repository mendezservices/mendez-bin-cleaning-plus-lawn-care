<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendez Bin Cleaning + Lawn Care</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #222;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo img {
    width: 45px;
    height: 45px;
    border-radius: 8px;
  }

  .btn {
    background: #00ff88;
    color: black;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }

  .hero {
    text-align: center;
    padding: 60px 20px;
  }

  .hero h1 {
    font-size: 36px;
  }

  .hero p {
    color: #bbb;
  }

  .section {
    padding: 40px 20px;
    max-width: 1000px;
    margin: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
  }

  .card {
    background: #141420;
    padding: 15px;
    border-radius: 10px;
  }

  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #222;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #777;
    border-top: 1px solid #222;
  }
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="images/logo.jpg" alt="Logo">
    <h3>Mendez Cleaning & Lawn Care</h3>
  </div>

  <a class="btn" href="sms:+13612175918">Get Quote</a>
</header>

<div class="hero">
  <h1>Clean Yards. Clean Bins. Reliable Service.</h1>
  <p>Affordable lawn care and trash can cleaning near you.</p>
  <a class="btn" href="sms:+13612175918">Request Quote</a>
</div>

<div class="section">
  <h2>Services</h2>

  <div class="grid">
    <div class="card">Lawn Mowing & Edging</div>
    <div class="card">Trash Can Deep Cleaning</div>
    <div class="card">Yard Cleanup</div>
  </div>
</div>

<div class="section">
  <h2>Before & After</h2>

  <div class="grid gallery">
    <img src="images/yard-before.jpg" alt="Yard Before">
    <img src="images/yard-after.jpg" alt="Yard After">
    <img src="images/trashcan-before.jpg" alt="Trash Before">
    <img src="images/trashcan-after.jpg" alt="Trash After">
  </div>
</div>

<footer>
  © 2026 Mendez Bin Cleaning + Lawn Care
</footer>

</body>
</html>
